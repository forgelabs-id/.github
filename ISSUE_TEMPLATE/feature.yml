name: Feature
description: A new capability or a change to existing behaviour
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Fill through **Acceptance criteria**. The sections after it may stay empty
        if undecided, but an issue without testable criteria will be rejected at
        review.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph from the user's side. "As a ..., I want ..., so that ...".
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Current problem
      description: How it works today, with measured evidence where available (path:line, output, numbers).
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Short bullets. Name the components touched.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      placeholder: |
        In scope:
        - ...

        Out of scope (handled separately):
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Numbered, each verifiable by a command or an observation.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Rejected alternatives (optional)
      description: One line per alternative, plus why it was rejected.

  - type: textarea
    id: risks
    attributes:
      label: Risks (optional)
      description: What could break, and the mitigation.

  - type: textarea
    id: open
    attributes:
      label: Open questions (optional)
      description: Decisions not yet made, and who decides.
